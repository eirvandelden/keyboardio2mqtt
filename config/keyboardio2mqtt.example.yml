# Copy this to ~/.config/keyboardio2mqtt/config.yml and fill in your own broker.
#
# The password is never written here. Put an op:// reference instead and the
# daemon reads it from 1Password at startup with the `op` command, so unlock
# 1Password before the daemon starts. A plain password also works if you would
# rather not use 1Password.
#
# The username may be a reference too, so a broker account kept in 1Password
# lives in one place rather than two.

broker:
  host: mqtt.home.arpa
  port: 1883
  username: op://Familie/MqttBroker/username
  password: op://Familie/MqttBroker/password

# Where the daemon remembers what the availability light was last asked for.
# Leave this out and it lives under your own state directory.
state_file: ~/.local/state/keyboardio2mqtt/state.json

# How much the daemon says for itself: debug, info, warn or error.
log_level: info

# Optional. Give a keyboard a name a person would recognise. The key is the
# keyboard's identity, which is its USB serial number and which the daemon logs
# when it finds one. A keyboard left out here is simply called Keyboardio
# Model 100.
keyboards:
  65644FE61339: Desk keyboard
